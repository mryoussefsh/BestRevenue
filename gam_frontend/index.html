<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindora X</title>
    <style>
      /* Global Website Preloader Styles */
      .preloader-overlay {
        position: fixed;
        inset: 0;
        background: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      
      .preloader-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Background glowing orbs */
      .preloader-glow-1, .preloader-glow-2 {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.15;
        pointer-events: none;
        z-index: 1;
      }
      .preloader-glow-1 {
        top: 20%;
        left: 25%;
        width: 300px;
        height: 300px;
        background: #00f2fe;
        animation: preloaderFloat1 8s ease-in-out infinite;
      }
      .preloader-glow-2 {
        bottom: 20%;
        right: 25%;
        width: 350px;
        height: 350px;
        background: #8b5cf6;
        animation: preloaderFloat2 10s ease-in-out infinite;
      }

      @keyframes preloaderFloat1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.1); }
      }
      @keyframes preloaderFloat2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-40px, 30px) scale(1.05); }
      }

      .preloader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .preloader-orb-container {
        position: relative;
        width: 90px;
        height: 90px;
        margin-bottom: 24px;
      }

      .preloader-orb-outer {
        position: absolute;
        inset: 0;
        border: 3.5px solid transparent;
        border-top-color: #00f2fe;
        border-bottom-color: #8b5cf6;
        border-radius: 50%;
        animation: preloaderSpinOuter 1.5s cubic-bezier(0.53, 0.21, 0.29, 0.67) infinite;
        filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4)) drop-shadow(0 0 16px rgba(139, 92, 246, 0.2));
      }

      .preloader-orb-inner {
        position: absolute;
        inset: 8px;
        border: 2.5px solid transparent;
        border-left-color: #5eead4;
        border-right-color: #a78bfa;
        border-radius: 50%;
        animation: preloaderSpinInner 1.2s cubic-bezier(0.53, 0.21, 0.29, 0.67) infinite;
        opacity: 0.8;
      }

      .preloader-logo-pulse {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #00f2fe;
        animation: preloaderPulse 1.8s ease-in-out infinite;
      }

      @keyframes preloaderSpinOuter {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes preloaderSpinInner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      @keyframes preloaderPulse {
        0%, 100% { transform: scale(0.95); opacity: 0.75; filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.3)); }
        50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.6)); }
      }

      .preloader-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 8px 0;
        text-transform: uppercase;
      }

      .preloader-status {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(0, 242, 254, 0.08);
        padding: 6px 14px;
        border-radius: 9999px;
        backdrop-filter: blur(8px);
      }

      .preloader-dot {
        width: 6px;
        height: 6px;
        background: #00f2fe;
        border-radius: 50%;
        box-shadow: 0 0 8px #00f2fe, 0 0 16px #00f2fe;
        animation: preloaderDotPulse 1.4s ease-in-out infinite;
      }

      .preloader-text {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      @keyframes preloaderDotPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- Website Preloader Overlay -->
    <div id="global-preloader" class="preloader-overlay">
      <div class="preloader-glow-1"></div>
      <div class="preloader-glow-2"></div>
      <div class="preloader-content">
        <div class="preloader-orb-container">
          <div class="preloader-orb-outer"></div>
          <div class="preloader-orb-inner"></div>
          <div class="preloader-logo-pulse">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
          </div>
        </div>
        <h1 class="preloader-title">Mindora X</h1>
        <div class="preloader-status">
          <span class="preloader-dot"></span>
          <span class="preloader-text">Loading...</span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
